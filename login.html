<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hlavasapp · Přihlášení</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root{--frame:#1E1E1E;--card:#F7F7F7;--ink:#0A0A0A;--muted:#6B6B6B;--line:#E4E4E4;--red:#D63333;--red-dark:#B82626;
    --font:"Helvetica Neue", Helvetica, Arial, sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--frame);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .frame{padding:16px;min-height:100vh;display:flex}
  .card{background:var(--card);border-radius:14px;flex:1;display:flex;flex-direction:column;padding:48px 56px 40px}
  .logo{height:32px;width:auto;align-self:flex-start}
  main{flex:1;display:flex;align-items:center}
  form{width:100%;max-width:420px}
  h1{font-size:64px;font-weight:700;letter-spacing:-0.03em;margin:0 0 36px;line-height:1}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  input{font:inherit;font-size:16px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:13px 14px;width:100%;outline:none;margin-bottom:18px;color:var(--ink)}
  input:focus{border-color:var(--ink)}
  .go{display:flex;align-items:center;gap:16px;margin-top:10px;background:none;border:none;padding:0;font:inherit;font-size:20px;font-weight:700;cursor:pointer;color:var(--ink)}
  .go span{width:52px;height:52px;border-radius:50%;background:var(--red);color:#fff;display:inline-flex;align-items:center;justify-content:center;transition:background .15s, transform .15s}
  .go:hover span{background:var(--red-dark);transform:scale(1.05)}
  .go svg{width:46%;height:46%}
  .err{background:var(--red);color:#fff;border-radius:10px;padding:12px 16px;font-weight:500;margin-bottom:22px}
  footer{color:var(--muted);font-size:13px}
  @media (max-width:760px){.card{padding:28px 20px} h1{font-size:44px}}
</style>
</head>
